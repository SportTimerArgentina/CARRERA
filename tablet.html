<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sport Timer - Rollers</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080c10;--surface:#111720;--surface2:#1a2230;--border:#1e2d40;
  --accent:#00e5ff;--accent2:#ff6b35;--green:#39ff14;--text:#e8f4f8;
  --muted:#5a7a8a;--danger:#ff3b5c;--yellow:#ffed00;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh}
body::before{content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(0,229,255,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,229,255,0.03) 1px,transparent 1px);
  background-size:40px 40px;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding-bottom:60px}

/* HEADER */
header{background:#111720;border-bottom:3px solid var(--yellow);padding:10px 20px;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
header img{height:52px;object-fit:contain}
.live{display:flex;align-items:center;gap:8px}
.livedot{width:12px;height:12px;border-radius:50%;background:var(--danger);
  box-shadow:0 0 10px var(--danger);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.2)}}
.livetxt{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--danger)}

/* EVENT BAR */
.evbar{background:var(--surface2);border-bottom:1px solid var(--border);
  padding:8px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.evname{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--accent);letter-spacing:1px}
.conn{font-size:11px;padding:5px 14px;border-radius:20px;border:1px solid var(--border);color:var(--muted);transition:all .3s}
.conn.ok{color:var(--green);border-color:var(--green)}
.conn.err{color:var(--danger);border-color:var(--danger)}

/* PAGE TITLE */
.page-title{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:3px;
  color:var(--muted);text-transform:uppercase;text-align:center;padding:16px 20px 6px}

/* DISTANCIAS GRID — 4 columnas en desktop, colapsa en mobile */
.distances-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:0;
  padding:0 16px 20px;
}
@media(max-width:1100px){.distances-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.distances-grid{grid-template-columns:1fr;padding:0 8px 20px;}}

/* BLOQUE DE DISTANCIA */
.dist-block{
  border-right:1px solid var(--border);
  min-height:300px;
  display:flex;
  flex-direction:column;
}
.dist-block:last-child{border-right:none}
@media(max-width:1100px){
  .dist-block:nth-child(2n){border-right:none}
  .dist-block:nth-child(n+3){border-top:1px solid var(--border)}
}
@media(max-width:600px){
  .dist-block{border-right:none;border-top:1px solid var(--border)}
  .dist-block:first-child{border-top:none}
}

/* HEADER DEL BLOQUE */
.dist-header{
  padding:14px 16px 10px;
  border-bottom:2px solid var(--border);
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
  position:sticky;
  top:75px;
  background:var(--bg);
  z-index:10;
}
.dist-title{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:3px;color:var(--accent);line-height:1}
.dist-sub{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:3px}
.dist-badge{
  font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--muted);
  padding:3px 10px;border:1px solid var(--border);border-radius:20px;white-space:nowrap;margin-top:4px;
  flex-shrink:0;
}
.dist-badge.has-data{color:var(--green);border-color:rgba(57,255,20,.4)}

/* TABLA DE RESULTADOS */
.results-table{flex:1;overflow:hidden}

/* FILA DE RESULTADO */
.res-row{
  display:grid;
  grid-template-columns:34px 52px 1fr auto;
  align-items:center;
  gap:8px;
  padding:8px 16px;
  border-bottom:1px solid rgba(30,45,64,0.5);
  transition:background .15s;
}
.res-row:last-child{border-bottom:none}
.res-row.new{animation:pop .7s ease}
@keyframes pop{from{background:rgba(57,255,20,.15)}to{background:transparent}}

/* MEDALLAS Y POSICION */
.res-pos{font-family:'Bebas Neue',sans-serif;font-size:20px;text-align:center;line-height:1}
.res-pos.gold{color:#ffd700;text-shadow:0 0 10px rgba(255,215,0,.5);font-size:22px}
.res-pos.silver{color:#c0c0c0}
.res-pos.bronze{color:#cd7f32}
.res-pos.other{color:var(--muted)}

/* DORSAL */
.res-dors{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--accent2);line-height:1;text-align:center}

/* INFO */
.res-info{min-width:0}
.res-name{font-size:12px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.res-cat{font-size:10px;color:var(--yellow);margin-top:2px;letter-spacing:.5px}
.res-catpos{font-size:10px;color:var(--muted);margin-top:1px}

/* TIEMPO */
.res-time{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--text);text-align:right;white-space:nowrap}

/* SEPARADOR DE CATEGORIA */
.cat-sep{
  padding:5px 16px 3px;
  background:rgba(255,237,0,.04);
  border-bottom:1px solid rgba(255,237,0,.12);
  border-top:1px solid rgba(255,237,0,.12);
  font-family:'Bebas Neue',sans-serif;
  font-size:11px;
  letter-spacing:2px;
  color:var(--yellow);
  display:flex;
  align-items:center;
  gap:8px;
}
.cat-sep-count{
  font-size:10px;
  color:var(--muted);
  font-family:'DM Mono',monospace;
  letter-spacing:0;
}

/* EMPTY STATE */
.dist-empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:12px;letter-spacing:.5px}

/* TABS DE VISTA */
.view-tabs{display:flex;gap:0;padding:10px 16px 0;border-bottom:1px solid var(--border)}
.vtab{
  flex:1;padding:7px 4px;text-align:center;
  font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;
  color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;
  transition:all .2s;
}
.vtab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* BUSCADOR */
.search-bar{
  padding:10px 16px 0;
}
.search-input{
  width:100%;padding:8px 12px;
  border-radius:8px;border:1px solid var(--border);
  background:var(--surface2);color:var(--text);
  font-family:'DM Mono',monospace;font-size:13px;
}
.search-input:focus{outline:none;border-color:var(--accent)}
.search-input::placeholder{color:var(--muted)}

/* CONTADOR GLOBAL */
.global-stats{
  display:flex;gap:16px;flex-wrap:wrap;padding:8px 16px 12px;
  border-bottom:1px solid var(--border);
}
.gs-item{font-size:11px;color:var(--muted)}
.gs-item strong{font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--text);margin-right:4px}
</style>
</head>
<body>
<div class="wrap">

<header>
  <img id="logoimg" alt="Sport Timer">
  <div class="live">
    <div class="livedot"></div>
    <div class="livetxt">EN VIVO</div>
  </div>
</header>

<div class="evbar">
  <div class="evname" id="evname">Cargando evento...</div>
  <div class="conn" id="conn">Conectando...</div>
</div>

<div class="global-stats" id="global-stats"></div>

<div class="search-bar">
  <input class="search-input" id="search" type="text" placeholder="🔍  Buscar por dorsal o nombre..." autocomplete="off">
</div>

<div class="view-tabs">
  <div class="vtab active" id="vtab-general" onclick="setView('general')">📋 GENERAL</div>
  <div class="vtab" id="vtab-categoria" onclick="setView('categoria')">🏷️ POR CATEGORÍA</div>
</div>

<div class="page-title" id="page-title">⬇ Resultados en tiempo real</div>

<div class="distances-grid" id="distances-grid">
  <div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--muted);font-size:14px">
    Esperando corredores...
  </div>
</div>

</div>

var FIREBASE = "https://sporttimer-482b3-default-rtdb.firebaseio.com";


document.getElementById("logoimg").src = "data:image/png;base64," + LOGO;

// ── CONFIG ─────────────────────────────────────────────
var DIST_ORDER  = ["5K","12K","21K","42K"];
var DIST_VUELTAS = {"5K":"1 vuelta","12K":"3 vueltas","21K":"5 vueltas","42K":"9 vueltas"};

// ── ESTADO ─────────────────────────────────────────────
var lastEntries  = [];
var lastNewKeys  = {};
var currentView  = "general"; // "general" | "categoria"
var searchQuery  = "";

// ── UTILS ──────────────────────────────────────────────
function setConn(msg, cls) {
  var el = document.getElementById("conn");
  el.textContent = msg;
  el.className = "conn " + (cls || "");
}

function normalizeDistKey(dist) {
  if (!dist) return "";
  var m = dist.toUpperCase().match(/(\d+)\s*K/);
  if (!m) return "";
  return m[1] + "K";
}

function posClass(p) {
  if (p === 1) return "gold";
  if (p === 2) return "silver";
  if (p === 3) return "bronze";
  return "other";
}

function posLabel(p) {
  if (p === 1) return "🥇";
  if (p === 2) return "🥈";
  if (p === 3) return "🥉";
  return p + "°";
}

function setView(v) {
  currentView = v;
  document.getElementById("vtab-general").className   = "vtab" + (v === "general"   ? " active" : "");
  document.getElementById("vtab-categoria").className = "vtab" + (v === "categoria" ? " active" : "");
  renderAll(lastEntries);
}

// ── BUSCADOR ───────────────────────────────────────────
document.getElementById("search").addEventListener("input", function() {
  searchQuery = this.value.trim().toLowerCase();
  renderAll(lastEntries);
});

// ── RENDER PRINCIPAL ───────────────────────────────────
function renderAll(entries) {
  lastEntries = entries;
  var grid = document.getElementById("distances-grid");

  // Filtro de búsqueda
  var filtered = entries;
  if (searchQuery) {
    filtered = entries.filter(function(e) {
      var d = String(e.dorsal || "").toLowerCase();
      var n = (e.name || "").toLowerCase();
      return d.indexOf(searchQuery) >= 0 || n.indexOf(searchQuery) >= 0;
    });
  }

  if (!filtered.length) {
    if (searchQuery) {
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--muted);font-size:13px">Sin resultados para "' + searchQuery + '"</div>';
    } else {
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--muted);font-size:14px">Esperando corredores...</div>';
    }
    return;
  }

  // Agrupar por distancia
  var groups = {};
  for (var i = 0; i < filtered.length; i++) {
    var e = filtered[i];
    var dk = normalizeDistKey(e.dist || "");
    if (!dk) dk = "SIN DIST";
    if (!groups[dk]) groups[dk] = [];
    groups[dk].push(e);
  }

  // Orden fijo de distancias
  var distKeys = [];
  for (var d = 0; d < DIST_ORDER.length; d++) {
    if (groups[DIST_ORDER[d]]) distKeys.push(DIST_ORDER[d]);
  }
  for (var dk2 in groups) {
    if (DIST_ORDER.indexOf(dk2) === -1) distKeys.push(dk2);
  }

  var html = "";
  for (var di = 0; di < distKeys.length; di++) {
    var distKey = distKeys[di];
    var group = groups[distKey];
    var vueltas = DIST_VUELTAS[distKey] || "";

    html += '<div class="dist-block">';
    html += '<div class="dist-header">';
    html += '<div>';
    html += '<div class="dist-title">' + distKey + '</div>';
    if (vueltas) html += '<div class="dist-sub">' + vueltas + '</div>';
    html += '</div>';
    html += '<div class="dist-badge' + (group.length ? ' has-data' : '') + '">';
    html += group.length + ' llegaron';
    html += '</div>';
    html += '</div>'; // dist-header

    html += '<div class="results-table">';

    if (currentView === "general") {
      html += renderGeneral(group);
    } else {
      html += renderPorCategoria(group);
    }

    html += '</div>'; // results-table
    html += '</div>'; // dist-block
  }

  grid.innerHTML = html;
}

// ── VISTA GENERAL (posición global por distancia) ──────
function renderGeneral(group) {
  // El array ya viene en orden de llegada (posición 1 = primero del array)
  var html = "";
  for (var i = 0; i < group.length; i++) {
    var e = group[i];
    var pos = i + 1;
    var key = e.dorsal + "_" + e.tiempo;
    var isNew = lastNewKeys[key];
    var pc = posClass(pos);
    html += '<div class="res-row' + (isNew ? " new" : "") + '">';
    html += '<div class="res-pos ' + pc + '">' + posLabel(pos) + '</div>';
    html += '<div class="res-dors">#' + e.dorsal + '</div>';
    html += '<div class="res-info">';
    html += '<div class="res-name">' + (e.name || "—") + '</div>';
    if (e.cat) html += '<div class="res-cat">' + e.cat + '</div>';
    html += '</div>';
    html += '<div class="res-time">' + (e.tiempo || "—") + '</div>';
    html += '</div>';
  }
  return html || '<div class="dist-empty">Esperando...</div>';
}

// ── VISTA POR CATEGORÍA ────────────────────────────────
function renderPorCategoria(group) {
  // Agrupar por categoría
  var cats = {};
  for (var i = 0; i < group.length; i++) {
    var e = group[i];
    var cat = e.cat || "SIN CATEGORÍA";
    if (!cats[cat]) cats[cat] = [];
    cats[cat].push(e);
  }

  var catKeys = Object.keys(cats).sort();
  var html = "";

  for (var ci = 0; ci < catKeys.length; ci++) {
    var cat = catKeys[ci];
    var catGroup = cats[cat];

    // Separador de categoría
    html += '<div class="cat-sep">';
    html += cat;
    html += '<span class="cat-sep-count">(' + catGroup.length + ')</span>';
    html += '</div>';

    // Los corredores dentro de la categoría en orden de llegada
    for (var j = 0; j < catGroup.length; j++) {
      var e2 = catGroup[j];
      var catPos = j + 1;
      var key2 = e2.dorsal + "_" + e2.tiempo;
      var isNew2 = lastNewKeys[key2];
      var pc2 = posClass(catPos);

      // Buscar posición general en el grupo
      var genPos = -1;
      for (var k = 0; k < group.length; k++) {
        if (group[k].dorsal === e2.dorsal && group[k].tiempo === e2.tiempo) {
          genPos = k + 1; break;
        }
      }

      html += '<div class="res-row' + (isNew2 ? " new" : "") + '">';
      html += '<div class="res-pos ' + pc2 + '">' + posLabel(catPos) + '</div>';
      html += '<div class="res-dors">#' + e2.dorsal + '</div>';
      html += '<div class="res-info">';
      html += '<div class="res-name">' + (e2.name || "—") + '</div>';
      if (genPos > 0) {
        html += '<div class="res-catpos">General: ' + genPos + '° lugar</div>';
      }
      html += '</div>';
      html += '<div class="res-time">' + (e2.tiempo || "—") + '</div>';
      html += '</div>';
    }
  }

  return html || '<div class="dist-empty">Esperando...</div>';
}

// ── ESTADÍSTICAS GLOBALES ──────────────────────────────
function renderStats(entries) {
  var total = entries.length;
  var byDist = {};
  for (var i = 0; i < entries.length; i++) {
    var dk = normalizeDistKey(entries[i].dist || "");
    if (dk) byDist[dk] = (byDist[dk] || 0) + 1;
  }
  var statsEl = document.getElementById("global-stats");
  var html = '<span class="gs-item"><strong>' + total + '</strong>llegaron en total</span>';
  for (var d = 0; d < DIST_ORDER.length; d++) {
    var dk2 = DIST_ORDER[d];
    if (byDist[dk2]) {
      html += '<span class="gs-item"><strong>' + byDist[dk2] + '</strong>' + dk2 + '</span>';
    }
  }
  statsEl.innerHTML = html;
}

// ── FETCH FIREBASE ─────────────────────────────────────
function fetchData() {
  fetch(FIREBASE + "/races.json")
    .then(function(r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(allRaces) {
      if (!allRaces) { setConn("Conectado — sin datos","ok"); renderAll([]); return; }

      // Tomar la carrera más recientemente actualizada
      var bestRace = null, bestTime = 0;
      var keys = Object.keys(allRaces);
      for (var k = 0; k < keys.length; k++) {
        var race = allRaces[keys[k]];
        if (race && race.updated && race.updated > bestTime) {
          bestTime = race.updated;
          bestRace = race;
        }
      }

      if (!bestRace) { setConn("Conectado — sin datos","ok"); renderAll([]); return; }

      setConn("● EN LINEA","ok");
      document.getElementById("evname").textContent = bestRace.name || "Evento activo";

      var rawEntries = bestRace.entries || [];
      var entries = [];
      if (Array.isArray(rawEntries)) {
        entries = rawEntries;
      } else {
        var ekeys = Object.keys(rawEntries).sort(function(a,b){ return parseInt(a)-parseInt(b); });
        for (var i = 0; i < ekeys.length; i++) entries.push(rawEntries[ekeys[i]]);
      }

      // También leer el CSV (db) para enriquecer con datos del corredor
      var db = bestRace.db || {};

      // Enriquecer entries con datos del CSV si le faltan
      for (var j = 0; j < entries.length; j++) {
        var e = entries[j];
        var csvRunner = db[String(e.dorsal)];
        if (csvRunner) {
          if (!e.name && csvRunner.name) e.name = csvRunner.name;
          if (!e.cat  && csvRunner.cat)  e.cat  = csvRunner.cat;
          if (!e.dist && csvRunner.dist) e.dist = csvRunner.dist;
        }
      }

      // Detectar nuevos llegados (animar)
      var prevCount = lastEntries.length;
      if (entries.length > prevCount) {
        for (var n = prevCount; n < entries.length; n++) {
          var key = entries[n].dorsal + "_" + entries[n].tiempo;
          lastNewKeys[key] = true;
        }
        setTimeout(function(){ lastNewKeys = {}; }, 3500);
      }

      renderStats(entries);
      renderAll(entries);
    })
    .catch(function(err) {
      setConn("Sin conexión","err");
      console.error(err);
    });
}

fetchData();
setInterval(fetchData, 2000);

})();
</script>
